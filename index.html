<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Arial; 
            padding: 20px; 
            text-align: center;
            background: var(--tg-theme-bg-color, #f5f5f5);
        }
        button { 
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, white);
            border: none; 
            padding: 15px 30px; 
            margin: 10px; 
            width: 250px;
            border-radius: 12px; 
            font-size: 18px; 
            cursor: pointer; 
        }
        #status { 
            font-weight: bold; 
            color: green; 
            margin: 20px;
        }
        #result { 
            margin-top: 30px; 
            padding: 20px; 
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            border-radius: 12px;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <h1>🚧 Тест Web App</h1>
    <div id="status">⏳ Подключение...</div>
    
    <button onclick="sendTest()">📤 Отправить ТЕСТ</button>
    <button onclick="sendCommand('stages')">🏗️ Этапы</button>
    <button onclick="sendCommand('ready')">🚧 Готовые</button>
    
    <div id="result">Нажми кнопку</div>

    <script>
        // Инициализация
        const tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.expand();
            document.getElementById('status').innerHTML = '✅ Telegram подключен';
            
            // Отправка тестовых данных
            window.sendTest = function() {
                const testData = {
                    type: 'test',
                    message: 'Привет от Web App!',
                    time: new Date().toISOString()
                };
                document.getElementById('result').innerHTML = '📤 Отправка теста...';
                tg.sendData(JSON.stringify(testData));
            };
            
            // Отправка команд
            window.sendCommand = function(cmd) {
                document.getElementById('result').innerHTML = `📤 Отправка команды: ${cmd}`;
                tg.sendData(JSON.stringify({
                    command: cmd,
                    time: new Date().toISOString()
                }));
            };
            
            tg.ready();
            console.log('Web App готов');
        } else {
            document.getElementById('status').innerHTML = '❌ Не в Telegram';
        }
    </script>
</body>
</html>
