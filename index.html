<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет строительства дорог</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #f8f9fa;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
            --primary: #3498db;
            --primary-dark: #2980b9;
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --gray: #95a5a6;
            --border-radius: 16px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .header p {
            color: var(--gray);
            font-size: 14px;
        }

        /* Статус */
        .status-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .status-icon.success {
            background: var(--success);
            color: white;
        }

        .status-icon.warning {
            background: var(--warning);
            color: var(--text-color);
        }

        .status-info {
            flex: 1;
        }

        .status-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .status-desc {
            font-size: 13px;
            color: var(--gray);
        }

        /* Карточки меню */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .menu-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px 12px;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            width: 100%;
            font-size: 16px;
            color: var(--text-color);
        }

        .menu-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .menu-card:active {
            transform: translateY(0);
        }

        .menu-emoji {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }

        .menu-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .menu-desc {
            font-size: 11px;
            color: var(--gray);
        }

        /* Цвета карточек */
        .menu-card[data-type="stages"] { border-top: 4px solid #9b59b6; }
        .menu-card[data-type="ready"] { border-top: 4px solid #3498db; }
        .menu-card[data-type="accepted"] { border-top: 4px solid #2ecc71; }
        .menu-card[data-type="stats"] { border-top: 4px solid #f1c40f; }
        .menu-card[data-type="employees"] { border-top: 4px solid #e67e22; }
        .menu-card[data-type="close"] { border-top: 4px solid #e74c3c; }

        /* Результат */
        .result-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            margin: 20px 0;
            box-shadow: var(--shadow);
            min-height: 150px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--bg-color);
        }

        .result-title {
            font-weight: 600;
            color: var(--primary);
        }

        .result-time {
            font-size: 11px;
            color: var(--gray);
        }

        .result-content {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .result-placeholder {
            color: var(--gray);
            font-style: italic;
            text-align: center;
            padding: 30px 0;
        }

        /* Информация о пользователе */
        .user-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-top: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .user-username {
            font-size: 12px;
            color: var(--gray);
        }

        .user-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-admin {
            background: var(--warning);
            color: var(--text-color);
        }

        .badge-user {
            background: var(--primary);
            color: white;
        }

        /* Анимация загрузки */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--bg-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .menu-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 24px; }
        }

        /* Темная тема Telegram */
        body[data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --card-bg: #2d2d2d;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <h1>🚧 Учет строительства</h1>
            <p>Система контроля дорожных работ</p>
        </div>

        <!-- Статус подключения -->
        <div class="status-card" id="statusCard">
            <div class="status-icon" id="statusIcon">🔄</div>
            <div class="status-info">
                <div class="status-title" id="statusTitle">Подключение...</div>
                <div class="status-desc" id="statusDesc">Ожидание ответа от Telegram</div>
            </div>
        </div>

        <!-- Меню (сетка карточек) -->
        <div class="menu-grid">
            <button class="menu-card" data-type="stages" onclick="sendCommand('stages')">
                <span class="menu-emoji">🏗️</span>
                <div class="menu-title">Этапы</div>
                <div class="menu-desc">Список всех этапов</div>
            </button>

            <button class="menu-card" data-type="ready" onclick="sendCommand('ready')">
                <span class="menu-emoji">🚧</span>
                <div class="menu-title">Готовые</div>
                <div class="menu-desc">Готовые участки</div>
            </button>

            <button class="menu-card" data-type="accepted" onclick="sendCommand('accepted')">
                <span class="menu-emoji">✅</span>
                <div class="menu-title">Сданные</div>
                <div class="menu-desc">История сдачи</div>
            </button>

            <button class="menu-card" data-type="stats" onclick="sendCommand('stats')">
                <span class="menu-emoji">📊</span>
                <div class="menu-title">Статистика</div>
                <div class="menu-desc">Общая информация</div>
            </button>

            <button class="menu-card" data-type="employees" onclick="sendCommand('employees')">
                <span class="menu-emoji">👥</span>
                <div class="menu-title">Сотрудники</div>
                <div class="menu-desc">Список персонала</div>
            </button>

            <button class="menu-card" data-type="close" onclick="closeApp()">
                <span class="menu-emoji">❌</span>
                <div class="menu-title">Закрыть</div>
                <div class="menu-desc">Выйти из приложения</div>
            </button>
        </div>

        <!-- Результат запроса -->
        <div class="result-card" id="resultCard">
            <div class="result-header">
                <span class="result-title">📋 Результат</span>
                <span class="result-time" id="resultTime"></span>
            </div>
            <div class="result-content" id="resultContent">
                <div class="result-placeholder">
                    👆 Нажмите на кнопку меню для получения данных
                </div>
            </div>
        </div>

        <!-- Информация о пользователе -->
        <div class="user-card" id="userCard">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-details">
                <div class="user-name" id="userName">Загрузка...</div>
                <div class="user-username" id="userUsername"></div>
            </div>
            <div class="user-badge" id="userBadge">👁️ Просмотр</div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram?.WebApp;
        
        // Состояние приложения
        const state = {
            isReady: false,
            lastCommand: null,
            lastResponse: null
        };

        // Функция обновления статуса
        function updateStatus(status, message, detail = '') {
            const icon = document.getElementById('statusIcon');
            const title = document.getElementById('statusTitle');
            const desc = document.getElementById('statusDesc');
            
            icon.className = 'status-icon';
            
            switch(status) {
                case 'success':
                    icon.classList.add('success');
                    icon.textContent = '✅';
                    title.textContent = message || 'Подключено';
                    desc.textContent = detail || 'Связь с ботом установлена';
                    break;
                case 'warning':
                    icon.classList.add('warning');
                    icon.textContent = '⚠️';
                    title.textContent = message || 'Предупреждение';
                    desc.textContent = detail || 'Режим ограниченной функциональности';
                    break;
                case 'error':
                    icon.classList.add('warning');
                    icon.textContent = '❌';
                    title.textContent = message || 'Ошибка';
                    desc.textContent = detail || 'Проверьте подключение';
                    break;
                default:
                    icon.textContent = '🔄';
                    title.textContent = message || 'Подключение...';
                    desc.textContent = detail || 'Ожидание ответа';
            }
        }

        // Функция отображения результата
        function showResult(content, isError = false) {
            const resultContent = document.getElementById('resultContent');
            const resultTime = document.getElementById('resultTime');
            
            // Время запроса
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            resultTime.textContent = `🕐 ${timeStr}`;
            
            // Контент
            if (typeof content === 'string') {
                resultContent.innerHTML = isError 
                    ? `<span style="color: #e74c3c;">❌ ${content}</span>`
                    : content.replace(/\n/g, '<br>');
            } else {
                resultContent.innerHTML = '<div class="result-placeholder">' + content + '</div>';
            }
        }

        // Функция показа загрузки
        function showLoading() {
            showResult('<div style="text-align: center;"><span class="loader"></span> Загрузка...</div>');
        }

        // Функция отправки команды
        function sendCommand(cmd) {
            if (!tg) {
                showResult('❌ Telegram Web App не доступен', true);
                return;
            }
            
            state.lastCommand = cmd;
            showLoading();
            
            // Отправляем команду в бота
            tg.sendData(JSON.stringify({
                command: cmd,
                timestamp: new Date().toISOString()
            }));
            
            // Вибрация
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        // Функция закрытия
        function closeApp() {
            if (tg) {
                tg.close();
            } else {
                alert('Закрытие приложения');
            }
        }

        // Функция обновления информации о пользователе
        function updateUserInfo() {
            if (!tg) return;
            
            const user = tg.initDataUnsafe?.user;
            const userName = document.getElementById('userName');
            const userUsername = document.getElementById('userUsername');
            const userAvatar = document.getElementById('userAvatar');
            const userBadge = document.getElementById('userBadge');
            
            if (user) {
                // Имя пользователя
                const firstName = user.first_name || '';
                const lastName = user.last_name || '';
                userName.textContent = `${firstName} ${lastName}`.trim();
                
                // Username
                userUsername.textContent = user.username ? `@${user.username}` : 'нет username';
                
                // Аватар (инициалы)
                const initials = (firstName.charAt(0) + (lastName.charAt(0) || '')).toUpperCase();
                userAvatar.textContent = initials || '👤';
                
                // Статус (админ или нет)
                // Здесь нужно передавать статус админа из бота
                userBadge.textContent = '👁️ Пользователь';
                userBadge.className = 'user-badge badge-user';
            } else {
                userName.textContent = 'Тестовый режим';
                userUsername.textContent = 'не в Telegram';
                userAvatar.textContent = '👤';
                userBadge.textContent = '🧪 Тест';
                userBadge.className = 'user-badge badge-warning';
            }
        }

        // Инициализация
        function init() {
            console.log('Инициализация Web App...');
            
            if (tg) {
                // Разворачиваем на весь экран
                tg.expand();
                
                // Настраиваем тему
                const theme = tg.themeParams;
                if (theme && theme.bg_color) {
                    document.body.style.background = theme.bg_color;
                }
                
                // Показываем кнопку "Назад"
                tg.BackButton.show();
                tg.BackButton.onClick(closeApp);
                
                // Настраиваем главную кнопку
                tg.MainButton.setText('📊 Статистика');
                tg.MainButton.onClick(() => sendCommand('stats'));
                tg.MainButton.show();
                
                // Обновляем информацию о пользователе
                updateUserInfo();
                
                // Успешное подключение
                updateStatus('success', '✅ Подключено к Telegram', 'Бот готов к работе');
                
                // Сообщаем о готовности
                tg.ready();
                state.isReady = true;
                
                // Обработка ответов от бота
                tg.onEvent('message', function(event) {
                    console.log('Получено сообщение:', event);
                    
                    if (event?.data) {
                        try {
                            // Пробуем распарсить JSON
                            const data = JSON.parse(event.data);
                            if (data.status === 'success') {
                                showResult(data.data || '✅ Данные получены');
                            } else {
                                showResult(data.message || event.data, true);
                            }
                        } catch {
                            // Если не JSON - просто текст
                            showResult(event.data);
                        }
                    }
                });
                
            } else {
                // Режим без Telegram
                updateStatus('warning', '⚠️ Тестовый режим', 'Работает вне Telegram');
                document.getElementById('userName').textContent = 'Тестовый пользователь';
                document.getElementById('userUsername').textContent = 'тестовый режим';
                
                // Тестовые команды
                window.sendCommand = function(cmd) {
                    const testData = {
                        'stages': '🏗️ ЭТАПЫ СТРОИТЕЛЬСТВА (тест)\n\n• Снятие ПРС: ПК1400-ПК1450\n• Устройство основания: ПК1450-ПК1500',
                        'ready': '🚧 ГОТОВЫЕ УЧАСТКИ (тест)\n\n• Снятие ПРС: ПК1400-ПК1420\n• Земляное полотно: ПК1450-ПК1480',
                        'accepted': '✅ СДАННЫЕ УЧАСТКИ (тест)\n\n• Покрытие: ПК1500-ПК1520 (принято)',
                        'stats': '📊 СТАТИСТИКА (тест)\n\n• Этапов: 6\n• Готовых: 3\n• Сдано: 1',
                        'employees': '👥 СОТРУДНИКИ (тест)\n\n• Иванов И.И. - Мастер\n• Петров П.П. - Рабочий'
                    };
                    
                    showResult(testData[cmd] || 'Тестовые данные для ' + cmd);
                };
                
                window.closeApp = function() {
                    alert('Закрытие приложения (тестовый режим)');
                };
            }
            
            console.log('Инициализация завершена');
        }

        // Запускаем при загрузке страницы
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
    </html>
