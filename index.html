<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ТЕСТ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Arial; 
            padding: 20px; 
            text-align: center;
            background: #f0f0f0;
        }
        button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 20px; 
            margin: 10px; 
            width: 300px; 
            border-radius: 10px; 
            font-size: 20px; 
            cursor: pointer; 
        }
        #status { 
            margin: 20px; 
            padding: 10px; 
            background: white; 
            border-radius: 5px; 
        }
    </style>
</head>
<body>
    <h1>🔴 ТЕСТОВЫЙ WEB APP</h1>
    <div id="status">⏳ Проверка...</div>
    
    <button onclick="sendTest()">📤 ОТПРАВИТЬ ТЕСТ</button>
    <button onclick="sendPiket()">📤 ОТПРАВИТЬ ПИКЕТ</button>

    <script>
        const tg = Telegram.WebApp;
        tg.expand();
        
        document.getElementById('status').innerHTML = '✅ Telegram подключен';
        
        function sendTest() {
            document.getElementById('status').innerHTML = '⏳ Отправка...';
            tg.sendData(JSON.stringify({
                action: 'test',
                message: 'Hello from Web App!',
                time: new Date().toISOString()
            }));
        }
        
        function sendPiket() {
            document.getElementById('status').innerHTML = '⏳ Отправка пикета...';
            tg.sendData(JSON.stringify({
                action: 'add_material',
                data: {
                    piket: 100,
                    side: 'left',
                    material: 'Щебень',
                    volume: 50,
                    unit: 'м³',
                    notes: 'Тест'
                }
            }));
        }
        
        tg.ready();
    </script>
</body>
</html>
