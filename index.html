<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет строительства дорог</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Шапка с навигацией -->
        <div class="nav-bar">
            <button class="nav-btn active" data-section="stages">🏗️ Этапы</button>
            <button class="nav-btn" data-section="ready">🚧 Готовые</button>
            <button class="nav-btn" data-section="accepted">✅ Сданные</button>
            <button class="nav-btn" data-section="stats">📊 Статистика</button>
            <button class="nav-btn" data-section="employees">👥 Сотрудники</button>
        </div>

        <!-- Информация о пользователе -->
        <div class="user-card" id="userCard">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-info">
                <div class="user-name" id="userName">Загрузка...</div>
                <div class="user-username" id="userUsername"></div>
            </div>
            <div class="user-badge" id="userBadge">👁️</div>
        </div>

        <!-- Кнопка добавления (только для админов) -->
        <button class="add-btn" id="addBtn" style="display: none;">➕ Добавить</button>

        <!-- Секция Этапы -->
        <div id="stages-section" class="section active">
            <div class="items-list" id="stagesList">
                <div class="loading">Загрузка этапов...</div>
            </div>
        </div>

        <!-- Секция Готовые участки -->
        <div id="ready-section" class="section">
            <div class="items-list" id="readyList">
                <div class="loading">Загрузка готовых участков...</div>
            </div>
        </div>

        <!-- Секция Сданные участки -->
        <div id="accepted-section" class="section">
            <div class="items-list" id="acceptedList">
                <div class="loading">Загрузка истории сдачи...</div>
            </div>
        </div>

        <!-- Секция Статистика -->
        <div id="stats-section" class="section">
            <div id="statsContent"></div>
        </div>

        <!-- Секция Сотрудники -->
        <div id="employees-section" class="section">
            <div class="items-list" id="employeesList">
                <div class="loading">Загрузка сотрудников...</div>
            </div>
        </div>

        <!-- МОДАЛЬНЫЕ ОКНА -->

        <!-- Добавление этапа -->
        <div class="modal" id="addStageModal">
            <div class="modal-content">
                <h3>➕ Добавить этап</h3>
                <select id="stageType">
                    <option value="Снятие ПРС">Снятие ПРС</option>
                    <option value="Устройство замены основания">Устройство замены основания</option>
                    <option value="Устройство земляного полотна">Устройство земляного полотна</option>
                    <option value="Устройство дополнительного слоя">Устройство дополнительного слоя</option>
                    <option value="Устройство несущего слоя">Устройство несущего слоя</option>
                    <option value="Устройство покрытия">Устройство покрытия</option>
                </select>
                <input type="number" id="stageStart" placeholder="Начальный пикет (1400-1900)" min="1400" max="1900">
                <input type="number" id="stageEnd" placeholder="Конечный пикет (1400-1900)" min="1400" max="1900">
                <input type="number" id="stageLayers" placeholder="Количество слоев" min="1" max="3" value="1">
                <div class="modal-buttons">
                    <button class="btn-cancel" id="cancelStageBtn">Отмена</button>
                    <button class="btn-confirm" id="createStageBtn">Создать</button>
                </div>
            </div>
        </div>

        <!-- Добавление готового участка -->
        <div class="modal" id="addReadyModal">
            <div class="modal-content">
                <h3>➕ Отметить готовый участок</h3>
                <select id="readyStageSelect"></select>
                <input type="number" id="readyStart" placeholder="Начальный пикет">
                <input type="number" id="readyEnd" placeholder="Конечный пикет">
                <input type="number" id="readyLayer" placeholder="Номер слоя" min="1" value="1">
                <div class="modal-buttons">
                    <button class="btn-cancel" id="cancelReadyBtn">Отмена</button>
                    <button class="btn-confirm" id="createReadyBtn">Отметить</button>
                </div>
            </div>
        </div>

        <!-- Добавление сотрудника -->
        <div class="modal" id="addEmployeeModal">
            <div class="modal-content">
                <h3>➕ Добавить сотрудника</h3>
                <input type="text" id="employeeName" placeholder="ФИО">
                <select id="employeePosition">
                    <option value="Дорожный рабочий">Дорожный рабочий</option>
                    <option value="Мастер">Мастер</option>
                    <option value="Прораб">Прораб</option>
                    <option value="Начальник участка">Начальник участка</option>
                </select>
                <input type="tel" id="employeePhone" placeholder="Телефон">
                <div class="modal-buttons">
                    <button class="btn-cancel" id="cancelEmployeeBtn">Отмена</button>
                    <button class="btn-confirm" id="createEmployeeBtn">Добавить</button>
                </div>
            </div>
        </div>

        <!-- Приемка участка -->
        <div class="modal" id="acceptModal">
            <div class="modal-content">
                <h3>✅ Принять участок</h3>
                <p id="acceptInfo"></p>
                <div class="modal-buttons">
                    <button class="btn-cancel" id="cancelAcceptBtn">Отмена</button>
                    <button class="btn-confirm" id="acceptBtn">Принять</button>
                </div>
            </div>
        </div>

        <!-- Отклонение участка -->
        <div class="modal" id="rejectModal">
            <div class="modal-content">
                <h3>❌ Отклонить участок</h3>
                <p id="rejectInfo"></p>
                <textarea id="rejectReason" placeholder="Причина отклонения"></textarea>
                <div class="modal-buttons">
                    <button class="btn-cancel" id="cancelRejectBtn">Отмена</button>
                    <button class="btn-confirm" id="rejectBtn">Отклонить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
