<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ФИНАЛЬНЫЙ ТЕСТ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; text-align: center; }
        button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 20px; 
            margin: 10px; 
            width: 300px; 
            border-radius: 10px; 
            font-size: 20px; 
            cursor: pointer; 
        }
        #status { font-size: 24px; margin: 20px; }
    </style>
</head>
<body>
    <h1>🔴 ФИНАЛЬНЫЙ ТЕСТ</h1>
    <div id="status">⏳ Проверка...</div>
    
    <button onclick="sendData()">📤 ОТПРАВИТЬ ДАННЫЕ</button>
    <button onclick="sendSimple()">📤 ПРОСТОЙ ТЕСТ</button>
    <button onclick="sendJSON()">📤 JSON ТЕСТ</button>
    
    <div id="result" style="margin-top: 20px; padding: 20px; background: #f0f0f0;"></div>

    <script>
        const tg = Telegram.WebApp;
        tg.expand();
        
        document.getElementById('status').innerHTML = '✅ Telegram подключен';
        document.getElementById('status').style.color = 'green';
        
        function showResult(msg) {
            document.getElementById('result').innerHTML = msg;
        }
        
        function sendData() {
            showResult('📤 Отправка...');
            tg.sendData("Простой текст");
        }
        
        function sendSimple() {
            showResult('📤 Отправка простого текста...');
            tg.sendData("HELLO FROM WEB APP");
        }
        
        function sendJSON() {
            showResult('📤 Отправка JSON...');
            tg.sendData(JSON.stringify({
                test: true,
                message: "Привет от Web App",
                time: new Date().toISOString()
            }));
        }
        
        tg.ready();
        console.log("Web App готов");
    </script>
</body>
</html>
