<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет строительства</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
            text-align: center;
        }
        button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 15px 20px;
            margin: 5px;
            width: 200px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            display: block;
            margin: 10px auto;
        }
        button:hover {
            opacity: 0.9;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            min-height: 50px;
        }
        #status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🚧 Учет строительства</h1>
    <p>Статус: <span id="status">Проверка...</span></p>
    
    <button onclick="sendCommand('stages')">🏗️ Этапы</button>
    <button onclick="sendCommand('ready')">🚧 Готовые</button>
    <button onclick="sendCommand('accepted')">✅ Сданные</button>
    <button onclick="sendCommand('stats')">📊 Статистика</button>
    <button onclick="sendCommand('employees')">👥 Сотрудники</button>
    <button onclick="closeApp()">❌ Закрыть</button>
    
    <div id="result">👆 Нажмите кнопку</div>

    <script>
        // Глобальная переменная для Telegram
        let tg = null;
        
        // Проверка Telegram
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.expand();
            document.getElementById('status').innerText = '✅ Telegram подключен';
            document.getElementById('status').style.color = 'green';
            
            // Показываем кнопку назад
            tg.BackButton.show();
            tg.BackButton.onClick(function() {
                if (tg) tg.close();
            });
            
            // Сообщаем о готовности
            tg.ready();
            
            console.log("Telegram Web App инициализирован");
        } else {
            document.getElementById('status').innerText = '❌ Не в Telegram';
            document.getElementById('status').style.color = 'red';
        }
        
        // Функция отправки команды
        function sendCommand(cmd) {
            console.log("Нажата кнопка:", cmd);
            document.getElementById('result').innerText = '⏳ Отправка команды: ' + cmd + '...';
            
            if (tg) {
                // Отправляем данные в Telegram
                tg.sendData(JSON.stringify({
                    command: cmd,
                    time: new Date().toISOString()
                }));
                console.log("Данные отправлены:", cmd);
            } else {
                // Тестовый режим для браузера
                document.getElementById('result').innerText = '❌ Не в Telegram. Команда: ' + cmd;
                alert('Тест: ' + cmd);
            }
        }
        
        // Функция закрытия
        function closeApp() {
            if (tg) {
                tg.close();
            } else {
                alert('Закрыть приложение');
            }
        }
        
        // Обработка ответов от бота
        if (tg) {
            tg.onEvent('message', function(event) {
                console.log("Получен ответ:", event);
                if (event && event.data) {
                    document.getElementById('result').innerText = event.data;
                }
            });
        }
        
        console.log("Страница загружена");
    </script>
</body>
</html>
