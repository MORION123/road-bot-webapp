<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет строительства</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>🚧 Учет строительства</h1>
    <p>Статус: <span id="status">Проверка...</span></p>
    
    <button onclick="sendCommand('stages')">🏗️ Этапы</button>
    <button onclick="sendCommand('ready')">🚧 Готовые</button>
    <button onclick="sendCommand('accepted')">✅ Сданные</button>
    <button onclick="sendCommand('stats')">📊 Статистика</button>
    <button onclick="sendCommand('employees')">👥 Сотрудники</button>
    <button onclick="closeApp()">❌ Закрыть</button>
    
    <div id="result" style="margin-top:20px; padding:10px; background:#f0f0f0;">
        Результат будет здесь
    </div>

    <script>
        // Проверка Telegram
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand();
            document.getElementById('status').innerText = '✅ Telegram подключен';
            
            // Функция отправки команды
            window.sendCommand = function(cmd) {
                document.getElementById('result').innerText = '⏳ Отправка...';
                tg.sendData(JSON.stringify({command: cmd}));
            };
            
            // Функция закрытия
            window.closeApp = function() {
                tg.close();
            };
            
            // Кнопка назад
            tg.BackButton.show();
            tg.BackButton.onClick(closeApp);
            
            // Готово
            tg.ready();
        } else {
            document.getElementById('status').innerText = '❌ Не в Telegram';
            // Тестовый режим для браузера
            window.sendCommand = function(cmd) {
                document.getElementById('result').innerText = 'Тест: ' + cmd;
            };
            window.closeApp = function() {
                alert('Закрыть');
            };
        }
    </script>
</body>
</html>
